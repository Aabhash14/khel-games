<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tihar Diyo · तिहार दियो</title>
  <meta name="description" content="A Tihar night puzzle. Turn the tiles so oil flows from the kalash and every diyo on the Newari house lights up. Five nights of Tihar, 30 levels, a new puzzle every day. English and Nepali.">
  <meta name="theme-color" content="#120d2e">
  <meta property="og:title" content="Tihar Diyo · तिहार दियो">
  <meta property="og:description" content="Turn the tiles, let the oil flow, light every diyo on the house. A new puzzle every day.">
  <meta property="og:type" content="website">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Preload the title and UI fonts when served over http(s); from file:// a crossorigin preload is refused.
    if (location.protocol !== 'file:') ['yatra-one-400-devanagari', 'mukta-700-latin'].forEach(function (f) {
      var l = document.createElement('link'); l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = ''; l.href = 'fonts/' + f + '.woff2'; document.head.appendChild(l);
    });
  </script>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body data-screen="home" data-night="laxmi">
  <div class="app" id="app">
    <header class="bar">
      <a class="home-link" href="../../"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="back">Khel</span></a>
      <div class="bar-r">
        <div class="lang" role="group" aria-label="Language · भाषा">
          <button type="button" data-set-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-set-lang="ne" aria-pressed="false" lang="ne">ने</button>
        </div>
        <button type="button" class="icon-btn" id="mute" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="cross" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="sr-only" data-t="sound">Sound</span>
        </button>
      </div>
    </header>

    <main id="stageMain">

      <!-- HOME -->
      <section class="screen on" data-screen="home" aria-labelledby="title">
        <div class="hero">
          <p class="kicker" data-t="kicker">A Tihar night puzzle</p>
          <h1 class="title" id="title"><span class="t-ne" lang="ne">तिहार दियो</span><span class="t-en">Tihar Diyo</span></h1>
          <canvas id="hero" class="hero-cv" role="img" aria-label="A Newari house lit up for Tihar"></canvas>
          <p class="pitch" data-t="pitch">Turn the tiles. Let the oil flow. Light every diyo on the house.</p>
        </div>
        <div class="menu">
          <button type="button" class="big-btn daily" id="goDaily">
            <span class="bb-main" data-t="daily">Aajako Diyo</span>
            <span class="bb-sub" id="dailySub"></span>
          </button>
          <button type="button" class="big-btn" id="goNights">
            <span class="bb-main" data-t="nights">The 5 nights</span>
            <span class="bb-sub" id="nightsSub"></span>
          </button>
          <p class="coin-line"><i class="foot-i" aria-hidden="true"></i><span id="coinHome"></span></p>
        </div>
        <details class="how">
          <summary data-t="howTitle">How to play</summary>
          <ol>
            <li data-t="how1"></li>
            <li data-t="how2"></li>
            <li data-t="how3"></li>
            <li data-t="how4"></li>
            <li data-t="how5"></li>
          </ol>
          <p class="keys" data-t="keys"></p>
        </details>
        <p class="credits" data-t="credits"></p>
      </section>

      <!-- NIGHTS -->
      <section class="screen" data-screen="nights" aria-labelledby="nightsH">
        <div class="sub-head">
          <button type="button" class="back-btn" id="nightsBack" data-t-label="home" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <h2 id="nightsH" data-t="nightsTitle">Five nights of Tihar</h2>
        </div>
        <ol class="night-list" id="nightList"></ol>
      </section>

      <!-- PLAY -->
      <section class="screen" data-screen="play" aria-labelledby="playLabel">
        <div class="hud">
          <button type="button" class="back-btn" id="playBack" data-t-label="menu" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <h2 class="play-label" id="playLabel"></h2>
          <div class="stat" id="movesBox"><b id="movesN">0</b><span class="stake" id="stake" aria-hidden="true"></span><span data-t="moves">Moves</span></div>
          <div class="stat par"><b id="parN">0</b><span data-t="par">Par</span></div>
        </div>
        <div class="stage-wrap">
          <canvas id="cv" tabindex="0" role="application" aria-label="Puzzle grid"></canvas>
        </div>
        <p class="sub" id="sub" aria-live="polite"></p>
        <p class="sr-only" id="srLive" aria-live="polite"></p>
        <div class="controls">
          <button type="button" class="ctl" id="restartBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="restart">Restart</span></button>
          <button type="button" class="ctl hint" id="hintBtn"><i class="foot-i" aria-hidden="true"></i><span id="hintTxt">Hint</span><b class="coin-badge" id="coinN" aria-hidden="true">3</b></button>
        </div>
      </section>
    </main>

    <div class="sheet-wrap" id="sheetWrap" hidden>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetH" tabindex="-1"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <noscript><p class="noscript">Tihar Diyo needs JavaScript. · तिहार दियो खेल्न JavaScript चाहिन्छ।</p></noscript>

  <script src="js/rules.js?v=3"></script>
  <script src="js/levels.js?v=3"></script>
  <script src="js/i18n.js?v=3"></script>
  <script src="js/audio.js?v=3"></script>
  <script src="js/art.js?v=3"></script>
  <script src="js/stage.js?v=3"></script>
  <script src="js/share.js?v=3"></script>
  <script src="js/main.js?v=3"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function () {});
  </script>
</body>
</html>
