<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sound Garden</title>
  <meta name="description" content="Plant seeds that grow into singing plants. Your garden becomes an ambient song.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0f26'/%3E%3Cpath d='M16 27 Q15 19 16 12' stroke='%236fae7c' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='10' r='5' fill='%23ffc978'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="garden" role="img" aria-label="A garden of singing plants. Click the soil to plant a seed; each plant plays its own note."></canvas>

  <header class="masthead">
    <h1>Sound Garden</h1>
    <p>Plant seeds in the soil. Each one grows into a plant that sings its own note: low on the left, high on the right, quieter further back.</p>
    <p class="keys">Right-click or long-press a plant to uproot it · <kbd>Space</kbd> pause · <kbd>S</kbd> scatter · <kbd>Z</kbd> undo</p>
  </header>

  <div class="hint" id="hint" aria-live="polite">Click the soil to plant your first seed</div>

  <nav class="controls" id="controls" aria-label="Garden controls">
    <div class="moods" role="group" aria-label="Mood">
      <button type="button" data-mood="dawn">Dawn</button>
      <button type="button" data-mood="dusk">Dusk</button>
      <button type="button" data-mood="mist">Mist</button>
      <button type="button" data-mood="deep">Deep</button>
    </div>

    <label class="slider" title="How fast the garden sways and sings">
      <span>Breeze</span>
      <input id="tempo" type="range" min="44" max="100" step="1" value="66">
    </label>

    <label class="slider" title="Volume">
      <span>Volume</span>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
    </label>

    <div class="actions">
      <button type="button" id="pause" aria-pressed="false">Pause</button>
      <button type="button" id="scatter">Scatter seeds</button>
      <button type="button" id="share">Copy link</button>
      <button type="button" id="clear">Clear</button>
    </div>
  </nav>

  <script src="garden.js"></script>
</body>
</html>
