<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Provenance: hand-authored for this repo; matches ipl-auction/icon.svg (gold paddle on a night stage, SOLD stamp). -->
  <defs>
    <clipPath id="ia-clip"><circle cx="256" cy="256" r="216"/></clipPath>
    <radialGradient id="ia-art-spot" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#f2c14e" stop-opacity=".5"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></radialGradient>
    <radialGradient id="ia-art-disc" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#f2c14e"/><stop offset="1" stop-color="#b9852a"/></radialGradient>
  </defs>
  <g clip-path="url(#ia-clip)">
    <rect width="512" height="512" fill="#0b0e1c"/>
    <rect width="512" height="512" fill="url(#ia-art-spot)"/>
    <path d="M0 400h512v112H0z" fill="#141a30"/>
    <g transform="rotate(-16 220 300)">
      <rect x="204" y="290" width="34" height="150" rx="12" fill="#6b4226"/>
      <circle cx="221" cy="200" r="112" fill="url(#ia-art-disc)"/>
      <text x="221" y="236" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="104" fill="#241a06">₹</text>
    </g>
    <g transform="rotate(-10 360 360)">
      <rect x="270" y="320" width="190" height="78" rx="12" fill="none" stroke="#e3197f" stroke-width="10"/>
      <text x="365" y="380" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="58" letter-spacing="4" fill="#e3197f">SOLD</text>
    </g>
  </g>
</svg>
