name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site is plain static files, so there is no build step.
      # Keep repo-only files out of the published site.
      - name: Prepare site
        run: |
          mkdir _site
          rsync -a --exclude='_site' --exclude='.git' --exclude='.github' \
            --exclude='.claude' --exclude='*.md' --exclude='.gitignore' ./ _site/
          # README/notes are excluded above, so ship the custom domain file explicitly
          cp CNAME _site/CNAME
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
