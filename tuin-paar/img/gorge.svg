<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMax slice">
  <!-- Backdrop for the gorge: dawn sky, the high Himalaya in haze, a forested ridge, and the shadowed inner gorge walls. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55668f"/><stop offset=".3" stop-color="#b08f9b"/><stop offset=".5" stop-color="#eeb38d"/><stop offset=".62" stop-color="#ffdcb2"/>
    </linearGradient>
    <radialGradient id="sun" cx="300" cy="250" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7e4"/><stop offset=".12" stop-color="#fff2d6"/><stop offset=".14" stop-color="#ffe6bd" stop-opacity=".5"/><stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset=".5" stop-color="#f6dccb"/><stop offset="1" stop-color="#c9a3a3"/></linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdcb2" stop-opacity="0"/><stop offset="1" stop-color="#ffd2a6" stop-opacity=".8"/></linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d7389"/><stop offset="1" stop-color="#6c5870"/></linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e4e4a"/><stop offset="1" stop-color="#232c2b"/></linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".15"/><stop offset=".6" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dff4f0" stop-opacity="0"/><stop offset="1" stop-color="#dff4f0" stop-opacity=".35"/></linearGradient>

    <!-- rugged ridgelines plus snow texture lit by the low sun on the right -->
    <filter id="peaks" x="-5%" y="-10%" width="110%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.09" numOctaves="4" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" result="rough"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.12" numOctaves="5" seed="8" result="h"/>
      <feDiffuseLighting in="h" surfaceScale="3" lighting-color="#fff4e6" result="lit"><feDistantLight azimuth="20" elevation="48"/></feDiffuseLighting>
      <feComposite in="lit" in2="rough" operator="arithmetic" k1=".42" k3=".62" result="tex"/>
      <feComposite in="tex" in2="rough" operator="in"/>
    </filter>
    <filter id="trees" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.2 0.06" numOctaves="2" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- far gorge walls: the same rock recipe as the cliffs, much darker -->
    <filter id="wall" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.06" numOctaves="5" seed="13" result="s"/>
      <feDiffuseLighting in="s" surfaceScale="6" lighting-color="#e9c9a8" result="l"><feDistantLight azimuth="200" elevation="35"/></feDiffuseLighting>
      <feFlood flood-color="#4a3b33" result="t"/>
      <feBlend in="l" in2="t" mode="multiply"/>
    </filter>
  </defs>

  <rect width="400" height="500" fill="url(#sky)"/>
  <rect width="400" height="500" fill="url(#sun)"/>

  <!-- back range, paler -->
  <path d="M0 286 L22 270 L40 276 L66 248 L80 256 L110 230 L128 246 L150 236 L170 250 L196 226 L214 240 L240 232 L262 248 L290 238 L312 252 L340 236 L366 250 L400 242 V320 H0Z" fill="#d9b9bb" opacity=".8" filter="url(#peaks)"/>
  <!-- main range -->
  <path d="M0 302 L30 276 L46 282 L72 244 L84 250 L104 210 L114 222 L126 216 L150 186 L162 204 L176 198 L192 222 L210 180 L222 196 L236 190 L254 214 L270 206 L288 230 L308 200 L322 186 L336 206 L352 218 L374 208 L400 236 V330 H0Z" fill="url(#snow)" filter="url(#peaks)"/>
  <!-- shadow faces of the main peaks (sun is on the right, so west faces fall into shade) -->
  <path d="M104 210 L96 244 L80 300 H108 L114 222Z M150 186 L140 226 L126 300 H160 L162 204Z M210 180 L200 222 L188 300 H222 L222 196Z M322 186 L310 230 L298 300 H334 L336 206Z" fill="#8f86a8" opacity=".45" filter="url(#peaks)"/>
  <rect y="210" width="400" height="120" fill="url(#haze)"/>

  <!-- mid ridge -->
  <path d="M0 312 C40 292 70 298 110 284 C150 272 180 294 220 286 C262 278 300 264 340 282 C366 292 384 286 400 290 V360 H0Z" fill="url(#ridge)" opacity=".92"/>
  <!-- forested ridge -->
  <path d="M0 336 C30 322 64 330 96 318 C130 306 160 326 196 320 C236 312 268 300 306 316 C340 328 372 318 400 322 V420 H0Z" fill="url(#forest)" filter="url(#trees)"/>

  <!-- inner gorge: far rock walls dropping into shadow, spray mist near the water -->
  <rect y="350" width="400" height="150" filter="url(#wall)"/>
  <path d="M0 350 C60 356 120 346 200 354 C280 362 340 348 400 352 V500 H0Z" fill="url(#deep)"/>
  <path d="M0 348 C70 360 140 344 200 352 S330 360 400 346 V364 C330 372 270 360 200 368 S70 360 0 366Z" fill="#1d2523" opacity=".55"/>
  <rect y="420" width="400" height="80" fill="url(#mist)"/>
</svg>
